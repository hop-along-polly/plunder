<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
      <title>Plunder Online</title>
      <link rel="stylesheet" type="text/css" href="./css/styles.css" />
      <link rel="stylesheet" type="text/css" href="./css/modals.css" />
      <link rel="stylesheet" type="text/css" href="./css/gameboard.css" />
      <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  </head>
  <body>
    <div>
      <h2>Turn Counters</h2>
    </div>
    <main>
      <h1>Gameboard</h1>
    </main>
    <div>
      <h2>Players</h2>
    </div>
    <div id="under-construction-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <i class="fa fa-anchor"></i>
          <span class="modal-title">Blimey! Still In Drydock</span>
          <span class="modal-close" data-close="under-construction-modal">x</span>
        </div>
        <p>This here gameboard be half built, matey.</p>
        <div class="modal-body">
          <img id="under-construction-icon" src="./assets/pirate_ship_icon.png" />
          <p id="under-construction-message">
            The shipwrights be hammerin' away below deck. Weigh anchor and check back
            soon, there's plunder to be had yet!
          </p>
        </div>
        <div class="btn-container">
          <button id="back-to-port-btn" class="btn">Back to Port</button>
        </div>
      </div>
    </div>
  </body>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="text/javascript" src="./js/gameplay.js"></script>
</html>
